# Local development stack for the MCP Bug Assistant.
#
#   docker compose -f deployment/docker-compose.yaml up -d
#   make db-init          # schema + seed
#
# Postgres stands in for Cloud SQL, and the Toolbox server is the same binary
# you run in production - only the `sources` block in tools.yaml differs.
name: bug-assistant

services:
  postgres:
    # pgvector image, so the `vector` type and the `<=>` operator exist.
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: ticketsdb
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Mounted read-only so a container restart cannot rewrite your schema.
      - ../data:/seed:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ticketsdb"]
      interval: 5s
      timeout: 5s
      retries: 10

  toolbox:
    image: us-central1-docker.pkg.dev/database-toolbox/toolbox/toolbox:latest
    depends_on:
      postgres:
        condition: service_healthy
    command:
      - --tools-file
      - /config/tools.yaml
      - --address
      - 0.0.0.0
      - --port
      - "5000"
    environment:
      # Consumed by the ${...} placeholders in tools.yaml.
      LOCAL_DB_HOST: postgres
      LOCAL_DB_PORT: "5432"
      LOCAL_DB_NAME: ticketsdb
      LOCAL_DB_USER: postgres
      LOCAL_DB_PASS: admin
      # The cloud-sql-postgres source is still declared in tools.yaml; give the
      # placeholders harmless values so the file parses locally.
      PROJECT_ID: local
      DB_USER: postgres
      DB_PASS: admin
    ports:
      - "5000:5000"
    volumes:
      - ./mcp-toolbox:/config:ro

volumes:
  pgdata:
