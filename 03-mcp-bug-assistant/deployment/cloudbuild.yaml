# Cloud Build pipeline for the bug assistant.
#
#   gcloud builds submit --config deployment/cloudbuild.yaml \
#     --substitutions=_REGION=us-central1,_TOOLBOX_URL=https://toolbox-xxx.run.app
substitutions:
  _REGION: us-central1
  _SERVICE: bug-assistant
  _REPO: agents
  # The deployed Toolbox service URL. The agent reaches the database only
  # through Toolbox, so it needs no database credentials of its own.
  _TOOLBOX_URL: http://127.0.0.1:5000
  _TOOLSET: tickets_toolset

options:
  logging: CLOUD_LOGGING_ONLY

steps:
  - id: test
    name: python:3.12-slim
    entrypoint: bash
    args:
      - -eu
      - -c
      - |
        pip install --no-cache-dir -r requirements-dev.txt
        python -m pytest tests/ -q

  - id: build
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - deployment/Dockerfile
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:$SHORT_SHA
      - .

  - id: push
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:$SHORT_SHA

  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:$SHORT_SHA
      - --region=${_REGION}
      - --platform=managed
      - --no-allow-unauthenticated
      - --cpu=1
      - --memory=1Gi
      - --timeout=600
      - --max-instances=10
      - --set-env-vars=GOOGLE_GENAI_USE_VERTEXAI=TRUE,GOOGLE_CLOUD_PROJECT=$PROJECT_ID,GOOGLE_CLOUD_LOCATION=${_REGION},MCP_TOOLBOX_URL=${_TOOLBOX_URL},MCP_TOOLBOX_TOOLSET=${_TOOLSET}
      # Secrets come from Secret Manager, never from --set-env-vars.
      - --set-secrets=GITHUB_PERSONAL_ACCESS_TOKEN=github-pat:latest

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:$SHORT_SHA
