[project]
name = "mcp-bug-assistant"
version = "1.0.0"
description = "ADK bug assistant spanning function, built-in, third-party, Google Cloud and MCP server tools."
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = { text = "Apache-2.0" }
dependencies = [
    "google-adk[toolbox]>=2.12.0,<3.0.0",
    "google-genai>=1.0.0",
    "mcp>=1.9.0",
    "pydantic>=2.10.0,<3.0.0",
    "pydantic-settings>=2.6.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3.0", "pytest-asyncio>=0.24.0", "ruff>=0.6.0", "PyYAML>=6.0"]
# Optional parity with the ADK samples' LangchainTool demonstration.
langchain = ["langchain-community>=0.3.0", "stackapi>=0.3.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["software_bug_assistant*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.ruff]
line-length = 95
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "C4"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["software_bug_assistant"]
