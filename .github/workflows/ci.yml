name: CI

on:
  push:
    branches: ["main", "claude/**"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.agent }} (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
        agent:
          - 01-lead-generation-deep-research
          - 02-gemini-cli-tool-agent
          - 03-mcp-bug-assistant
          - 04-code-review-assistant
          - 05-ecommerce-agent

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        working-directory: ${{ matrix.agent }}
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint
        working-directory: ${{ matrix.agent }}
        run: ruff check .

      # The suites are deliberately offline: no model credentials, no database,
      # no Gemini CLI, no network. A test that needs a secret is a test that
      # does not run on a fork's pull request.
      - name: Test
        working-directory: ${{ matrix.agent }}
        run: python -m pytest tests/ -q

  sql:
    name: SQL parses
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install sqlglot
      - name: Parse every .sql file as PostgreSQL
        run: |
          python - <<'PY'
          import pathlib, sys
          import sqlglot
          failed = []
          for path in sorted(pathlib.Path(".").glob("*/data/*.sql")):
              try:
                  sqlglot.parse(path.read_text(), read="postgres")
                  print(f"ok   {path}")
              except Exception as exc:
                  failed.append((path, exc))
                  print(f"FAIL {path}: {exc}")
          sys.exit(1 if failed else 0)
          PY

  yaml:
    name: Toolbox configs are valid
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install PyYAML
      - name: Validate tools.yaml files
        run: |
          python - <<'PY'
          import pathlib, sys
          import yaml
          failed = []
          for path in sorted(pathlib.Path(".").glob("*/**/tools.yaml")):
              try:
                  doc = yaml.safe_load(path.read_text())
                  tools = set(doc.get("tools") or {})
                  for name, entries in (doc.get("toolsets") or {}).items():
                      missing = set(entries) - tools
                      if missing:
                          raise ValueError(f"toolset {name!r} references undeclared: {sorted(missing)}")
                  # No credential may be a literal in a committed config.
                  for line in path.read_text().splitlines():
                      stripped = line.strip()
                      if stripped.startswith(("password:", "clientId:")) and "${" not in stripped:
                          raise ValueError(f"hardcoded credential: {stripped}")
                  print(f"ok   {path} ({len(tools)} tools)")
              except Exception as exc:
                  failed.append((path, exc))
                  print(f"FAIL {path}: {exc}")
          sys.exit(1 if failed else 0)
          PY

  eval-sets:
    name: Eval sets are well-formed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate evalset JSON
        run: |
          python - <<'PY'
          import json, pathlib, sys
          failed = []
          for path in sorted(pathlib.Path(".").glob("*/eval/*.json")):
              try:
                  doc = json.loads(path.read_text())
                  if path.name == "test_config.json":
                      assert "criteria" in doc, "missing 'criteria'"
                  else:
                      assert doc.get("eval_cases"), "no eval_cases"
                      for case in doc["eval_cases"]:
                          assert case.get("eval_id"), "a case has no eval_id"
                          assert case.get("conversation"), f"{case['eval_id']} has no conversation"
                  print(f"ok   {path}")
              except Exception as exc:
                  failed.append((path, exc))
                  print(f"FAIL {path}: {exc}")
          sys.exit(1 if failed else 0)
          PY
