# Cloud Build pipeline: test -> build -> push -> deploy to Cloud Run.
#
#   gcloud builds submit --config deployment/cloudbuild.yaml \
#     --substitutions=_REGION=us-central1,_SERVICE=leadgen-agent
substitutions:
  _REGION: us-central1
  _SERVICE: leadgen-agent
  _REPO: agents
  _MIN_INSTANCES: "0"
  _MAX_INSTANCES: "5"

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8

steps:
  - id: test
    name: python:3.12-slim
    entrypoint: bash
    args:
      - -eu
      - -c
      - |
        pip install --no-cache-dir -r requirements-dev.txt
        python -m pytest tests/ -q

  - id: build
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - deployment/Dockerfile
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:$SHORT_SHA
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:latest
      - .

  - id: push
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - --all-tags
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}

  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:$SHORT_SHA
      - --region=${_REGION}
      - --platform=managed
      - --no-allow-unauthenticated
      - --min-instances=${_MIN_INSTANCES}
      - --max-instances=${_MAX_INSTANCES}
      # Deep research fans out many parallel searches; give it room and time.
      - --cpu=2
      - --memory=2Gi
      - --timeout=900
      - --set-env-vars=GOOGLE_GENAI_USE_VERTEXAI=TRUE,GOOGLE_CLOUD_PROJECT=$PROJECT_ID,GOOGLE_CLOUD_LOCATION=${_REGION}

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}
