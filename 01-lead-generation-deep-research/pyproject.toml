[project]
name = "lead-generation-deep-research-agent"
version = "1.0.0"
description = "Deep research agent that discovers buying signals, then finds and scores B2B leads that exhibit them."
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = { text = "Apache-2.0" }
dependencies = [
    "google-adk>=2.12.0,<3.0.0",
    "google-genai>=1.0.0",
    "pydantic>=2.10.0,<3.0.0",
    "pydantic-settings>=2.6.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3.0", "pytest-asyncio>=0.24.0", "ruff>=0.6.0"]
deploy = ["google-cloud-aiplatform[agent_engines]>=1.95.0", "absl-py>=2.1.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["lead_generation_agent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
filterwarnings = [
    # ADK 2.x deprecates the workflow-agent classes in favour of `Workflow`,
    # which cannot yet be nested under an LlmAgent. Revisit when it can.
    "ignore:SequentialAgent is deprecated:DeprecationWarning",
    "ignore:LoopAgent is deprecated:DeprecationWarning",
    "ignore:ParallelAgent is deprecated:DeprecationWarning",
]

[tool.ruff]
line-length = 95
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "C4"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["lead_generation_agent"]
