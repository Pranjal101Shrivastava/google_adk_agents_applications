# Cloud Build pipeline for the e-commerce agent backend.
#
#   gcloud builds submit --config deployment/cloudbuild.yaml \
#     --substitutions=_REGION=us-central1,_TOOLBOX_URL=https://toolbox-xxx.run.app
substitutions:
  _REGION: us-central1
  _SERVICE: ecommerce-agent
  _REPO: agents
  _TOOLBOX_URL: http://127.0.0.1:5000
  _TOOLSET: storefront
  _GOOGLE_CLIENT_ID: ""
  _ALLOWED_ORIGINS: "http://localhost:5173"

options:
  logging: CLOUD_LOGGING_ONLY

steps:
  - id: test
    name: python:3.12-slim
    entrypoint: bash
    args:
      - -eu
      - -c
      - |
        pip install --no-cache-dir -r requirements-dev.txt
        python -m pytest tests/ -q

  - id: build
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - deployment/Dockerfile
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:$SHORT_SHA
      - .

  - id: push
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:$SHORT_SHA

  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:$SHORT_SHA
      - --region=${_REGION}
      - --platform=managed
      - --allow-unauthenticated
      - --cpu=1
      - --memory=1Gi
      - --timeout=300
      - --max-instances=20
      - --set-env-vars=GOOGLE_GENAI_USE_VERTEXAI=TRUE,GOOGLE_CLOUD_PROJECT=$PROJECT_ID,GOOGLE_CLOUD_LOCATION=${_REGION},TOOLBOX_URL=${_TOOLBOX_URL},TOOLBOX_TOOLSET=${_TOOLSET},GOOGLE_CLIENT_ID=${_GOOGLE_CLIENT_ID},ALLOWED_ORIGINS=${_ALLOWED_ORIGINS}
      # Sessions must be shared across instances once max-instances > 1.
      - --set-secrets=SESSION_DB_URL=session-db-url:latest

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:$SHORT_SHA
