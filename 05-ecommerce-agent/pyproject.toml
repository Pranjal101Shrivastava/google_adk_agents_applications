[project]
name = "ecommerce-agent"
version = "1.0.0"
description = "Production-quality ADK e-commerce agent with AlloyDB via MCP Toolbox, verified identity and exact pricing."
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = { text = "Apache-2.0" }
dependencies = [
    "google-adk[toolbox]>=2.12.0,<3.0.0",
    "google-genai>=1.0.0",
    "google-auth>=2.35.0",
    "requests>=2.32.0",
    "pydantic>=2.10.0,<3.0.0",
    "pydantic-settings>=2.6.0",
    "python-dotenv>=1.0.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "PyYAML>=6.0",
    "ruff>=0.6.0",
]
postgres = ["psycopg2-binary>=2.9.9"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ecommerce_agent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.ruff]
line-length = 95
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "C4"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["ecommerce_agent", "backend"]
