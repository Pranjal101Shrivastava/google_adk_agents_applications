# Monorepo-wide test configuration.
#
# Each agent also carries its own [tool.pytest.ini_options] so it can be
# tested standalone (`cd 0N-... && pytest`). This file is what makes
# `pytest` at the repo root collect every agent's suite in one run.
[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
testpaths =
    01-lead-generation-deep-research/tests
    02-gemini-cli-tool-agent/tests
    03-mcp-bug-assistant/tests
    04-code-review-assistant/tests
    05-ecommerce-agent/tests
pythonpath =
    01-lead-generation-deep-research
    02-gemini-cli-tool-agent
    03-mcp-bug-assistant
    04-code-review-assistant
    05-ecommerce-agent
filterwarnings =
    ignore:SequentialAgent is deprecated:DeprecationWarning
    ignore:LoopAgent is deprecated:DeprecationWarning
    ignore:ParallelAgent is deprecated:DeprecationWarning
