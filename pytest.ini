# Shared pytest settings for every agent in this monorepo.
#
# Each agent also carries its own [tool.pytest.ini_options], so
# `cd 0N-... && pytest` works standalone and is what CI runs.
#
# There is deliberately no aggregated `testpaths` here. Every agent has a
# `tests/` package, so collecting all five in one session makes five modules
# all want to be `tests.conftest` and pytest refuses. `make test` runs them
# agent by agent instead, which is also exactly what the CI matrix does.
[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
filterwarnings =
    ignore:SequentialAgent is deprecated:DeprecationWarning
    ignore:LoopAgent is deprecated:DeprecationWarning
    ignore:ParallelAgent is deprecated:DeprecationWarning
