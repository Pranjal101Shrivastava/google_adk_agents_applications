# Cloud Build pipeline: test -> build -> push -> deploy to Cloud Run.
#
#   gcloud builds submit --config deployment/cloudbuild.yaml \
#     --substitutions=_REGION=us-central1,_SERVICE=gemini-cli-agent
substitutions:
  _REGION: us-central1
  _SERVICE: gemini-cli-agent
  _REPO: agents
  _GEMINI_CLI_VERSION: "0.4.1"
  # Workspaces live on tmpfs, so memory must cover the agent plus the clones.
  _MEMORY: 4Gi
  _CPU: "2"

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8

steps:
  - id: test
    name: python:3.12-slim
    entrypoint: bash
    args:
      - -eu
      - -c
      - |
        apt-get update && apt-get install -y --no-install-recommends git
        pip install --no-cache-dir -r requirements-dev.txt
        python -m pytest tests/ -q

  - id: build
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - deployment/Dockerfile
      - --build-arg
      - GEMINI_CLI_VERSION=${_GEMINI_CLI_VERSION}
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:$SHORT_SHA
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:latest
      - .

  - id: push
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - --all-tags
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}

  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:$SHORT_SHA
      - --region=${_REGION}
      - --platform=managed
      - --no-allow-unauthenticated
      - --cpu=${_CPU}
      - --memory=${_MEMORY}
      # A clone plus several CLI invocations does not fit in a short timeout.
      - --timeout=3600
      # Workspaces are per-instance state, so keep a request on its instance.
      - --session-affinity
      - --max-instances=5
      - --set-env-vars=GOOGLE_GENAI_USE_VERTEXAI=TRUE,GOOGLE_CLOUD_PROJECT=$PROJECT_ID,GOOGLE_CLOUD_LOCATION=${_REGION},WORKSPACE_ROOT=/workspaces

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}
